<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Flight Deck 0DTE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&amp;family=Manrope:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
html,body{overflow-x:clip}body{margin:0;background:#08142B;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
svg text{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:'Montserrat','Manrope',sans-serif}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace}
a{color:#65B837}a:hover{color:#83DC28}
</style>

</head>
<body>
<div id="app"><div style="color:#8A94A3;font-family:Inter,system-ui,sans-serif;padding:24px">Cargando lectura…</div></div>
<template id="tpl">
<div style="background: #08142B; color: #E8EDF5; font-family: 'Manrope', system-ui, sans-serif; min-height: 100vh; padding: 16px 20px 40px; box-sizing: border-box">
<div style="max-width: 1440px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px">

<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 24px; padding-bottom: 12px; border-bottom: 1px solid #22396A">
<div style="display: flex; align-items: center; gap: 12px; flex: 1 1 280px; min-width: 0">
<img src="logo-katapunta.png" alt="Katapunta" width="150" height="44" style="flex: none; height: 44px; width: auto">
<div style="flex: none; width: 1px; align-self: stretch; background: #22396A"></div>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<div style="font-size: 11px; font-weight: 500; letter-spacing: 0.14em; color: #65B837; font-family: 'Montserrat', sans-serif; font-weight: 600">FLIGHT DECK · 0DTE</div>
<h1 style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em">{{dayTitle}}</h1>
<div style="font-size: 12px; color: #A3B0C6">{{d.subtitle}}</div>
</div>
</div>
<div role="group" aria-label="Elegir subyacente" style="display: flex; flex-wrap: wrap; background: #10254D; border: 1px solid #22396A; border-radius: 10px; padding: 3px; gap: 3px">
<template data-k="for" list="{{tabs}}" as="t" hint-placeholder-count="4">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="{{t.style}}">
<span style="font-size: 14px; font-weight: 600">{{t.sym}}</span>
<span style="font-size: 11px; color: {{t.subColor}}">{{t.sub}}</span>
</button>
</template>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; flex: 1 1 280px">
<template data-k="if" value="{{showToggle}}" hint-placeholder-val="{{true}}">
<div role="group" aria-label="Vista" style="display: flex; border: 1px solid #22396A; border-radius: 8px; overflow: hidden">
<button type="button" onClick="{{showSimple}}" aria-pressed="{{simplePressed}}" style="{{simpleBtnStyle}}">Simple</button>
<button type="button" onClick="{{showFull}}" aria-pressed="{{fullPressed}}" style="{{fullBtnStyle}}">Completa</button>
</div>
</template>
<div style="display: flex; align-items: center; gap: 8px; border: 1px solid #22396A; background: #10254D; padding: 6px 12px; border-radius: 999px; font-size: 12px">
<span style="color: #A3B0C6">Próximo evento</span>
<span style="font-weight: 600; color: #E8EDF5">{{nextEv}}</span>
</div>
<div style="{{status.chip}}">
<span style="{{status.dot}}"></span>
{{status.txt}}
</div>
<span style="font-size: 11px; color: #A3B0C6">{{readTxt}}</span>
</div>
</header>

<template data-k="if" value="{{isSimple}}" hint-placeholder-val="{{true}}">
<section aria-label="Lectura del día" style="display: flex; flex-direction: column; gap: 6px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px">
<template data-k="for" list="{{lect}}" as="lc" hint-placeholder-count="4">
<div style="background: #10254D; border: 1px solid #22396A; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<div style="font-size: 11px; font-weight: 500; letter-spacing: 0.1em; color: #A3B0C6"><span style="margin-right: 6px; color: #A3B0C6">{{lc.ic}}</span>{{lc.label}}</div>
<template data-k="if" value="{{lc.hasPill}}" hint-placeholder-val="{{false}}">
<span style="font-size: 10px; font-weight: 600; letter-spacing: 0.08em; padding: 3px 8px; border-radius: 999px; border: 1px solid {{lc.pillCol}}; color: {{lc.pillCol}}; white-space: nowrap">{{lc.pill}}</span>
</template>
</div>
<div style="display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap"><span style="font-family: {{lc.vff}}; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; color: {{lc.color}}">{{lc.value}}</span><span style="font-size: 13px; color: #A3B0C6">{{lc.sub}}</span></div>
<template data-k="if" value="{{lc.hasDots}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-wrap: wrap; gap: 6px 12px">
<template data-k="for" list="{{lc.dots}}" as="dt" hint-placeholder-count="3">
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #C9D3E3"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{dt.col}}"></span>{{dt.tf}}</span>
</template>
</div>
</template>
<template data-k="if" value="{{lc.hasDots2}}" hint-placeholder-val="{{false}}">
<div style="display: flex; gap: 14px; align-items: center">
<span style="font-size: 10px; letter-spacing: 0.08em; color: #A3B0C6">REGLA NUEVA</span>
<template data-k="for" list="{{lc.dots2}}" as="dt" hint-placeholder-count="3">
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #C9D3E3"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{dt.col}}"></span>{{dt.tf}}</span>
</template>
</div>
</template>
<template data-k="if" value="{{lc.hasBar}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="position: relative; height: 8px; background: #2A2414; border: 1px solid #4A3D1C; border-radius: 4px">
<div style="{{lc.barMark}}"></div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 11px; color: #A3B0C6"><span>{{lc.barL}}</span><span>{{lc.barR}}</span></div>
</div>
</template>
<template data-k="if" value="{{lc.hasSpark}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: stretch; gap: 2px; height: 56px">
<template data-k="for" list="{{lc.spark}}" as="sp" hint-placeholder-count="10">
<div style="{{sp.wrap}}"><div style="{{sp.wick}}"></div><div style="{{sp.body}}"></div><div style="{{sp.sma}}"></div></div>
</template>
</div>
</template>
<template data-k="if" value="{{lc.hasRng}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="position: relative; height: 20px">
<div style="{{lc.rng_open}}"></div>
<div style="{{lc.rng_rem}}"></div>
<div style="{{lc.rng_dA}}"></div>
<div style="{{lc.rng_dB}}"></div>
<div style="{{lc.rng_px}}"></div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 11px; color: #A3B0C6"><span>{{lc.rngL}}</span><span>{{lc.rngR}}</span></div>
</div>
</template>
<div style="font-size: 12px; color: #A3B0C6; line-height: 1.4; white-space: pre-line">{{lc.note}}</div>
</div>
</template>
</div>
<div style="font-size: 11px; color: #A3B0C6">{{simple.macro}}</div>
</section>
</template>

<template data-k="if" value="{{isFull}}" hint-placeholder-val="{{false}}">
<section aria-label="Cotizaciones con semáforo de dirección" style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; flex-wrap: wrap; background: #10254D; border: 1px solid #22396A; border-radius: 10px; overflow: hidden">
<template data-k="for" list="{{tape}}" as="t" hint-placeholder-count="6">
<div style="flex: 1 1 200px; min-width: 0; padding: 10px 14px; display: flex; flex-direction: column; gap: 5px; border-right: 1px solid #22396A; border-bottom: 1px solid #22396A; margin-bottom: -1px">
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 12px; font-weight: 600; color: #C9D3E3">{{t.sym}}</span>
<span style="font-size: 11px; color: #A3B0C6; border: 1px solid #22396A; border-radius: 4px; padding: 0 5px; white-space: nowrap">{{t.feed}}</span>
<span role="img" aria-label="{{t.aria}}" style="margin-left: auto; display: flex; align-items: center; gap: 6px">
<span style="display: flex; gap: 3px; padding: 3px 4px; background: #08142B; border: 1px solid #22396A; border-radius: 999px">
<span style="width: 8px; height: 8px; border-radius: 50%; background: {{t.l1}}"></span>
<span style="width: 8px; height: 8px; border-radius: 50%; background: {{t.l2}}"></span>
<span style="width: 8px; height: 8px; border-radius: 50%; background: {{t.l3}}"></span>
</span>
<span style="font-size: 11px; font-weight: 600; white-space: nowrap; color: {{t.dirColor}}">{{t.dirLabel}}</span>
</span>
</div>
<div style="display: flex; align-items: baseline; gap: 8px">
<span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 16px; font-weight: 500">{{t.px}}</span>
<span style="font-size: 12px; color: {{t.chgColor}}">{{t.chg}}</span>
</div>
<div style="font-size: 11px; color: #A3B0C6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.why}}</div>
</div>
</template>
</div>
<div style="font-size: 11px; color: #A3B0C6">Semáforo sobre el precio del índice (SPX o NDX): verde = alcista, rojo = bajista, gris = neutral. VIX, VXN, DXY y la tasa a 10 años cuentan al revés: si suben, se pinta rojo. La línea de abajo dice qué hace el propio instrumento. Regla en 15m: precio vs EMA 20 y EMA 20 vs EMA 50. Es lectura, no señal de entrada.</div>
</section>

<template data-k="if" value="{{d.hasWarn}}" hint-placeholder-val="{{false}}">
<div role="note" style="display: flex; gap: 10px; align-items: flex-start; background: #24151A; border: 1px solid #6B2E2C; border-radius: 10px; padding: 12px 16px; font-size: 13px; color: #F2C9C6">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F08A84" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
<span>{{d.warn}}</span>
</div>
</template>

<section aria-label="Niveles clave" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<template data-k="for" list="{{kpis}}" as="k" hint-placeholder-count="4">
<div style="background: #10254D; border: 1px solid #22396A; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 11px; font-weight: 500; letter-spacing: 0.1em; color: #A3B0C6">{{k.label}}</div>
<div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 26px; font-weight: 500; letter-spacing: -0.03em"><span style="color: {{k.c1}}">{{k.v1}}</span><span style="color: #5E6F91">{{k.sep}}</span><span style="color: {{k.c2}}">{{k.v2}}</span></div>
<template data-k="if" value="{{k.hasChip}}" hint-placeholder-val="{{false}}">
<span style="{{k.chipStyle}}">{{k.chip}}</span>
</template>
<template data-k="if" value="{{k.hasBar}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 4px; padding-top: 2px">
<div style="position: relative; height: 8px; background: #2A2414; border: 1px solid #4A3D1C; border-radius: 4px">
<div style="{{k.barMark}}"></div>
</div>
<div style="display: flex; justify-content: space-between; gap: 6px; font-size: 11px; color: #A3B0C6"><span>{{k.barL}}</span><span style="color: #C9D3E3">{{k.barMid}}</span><span>{{k.barR}}</span></div>
</div>
</template>
<div style="font-size: 13px; color: #A3B0C6; line-height: 1.4">{{k.note}}</div>
<div style="margin-top: auto; font-size: 11px; color: #A3B0C6; border-top: 1px solid #22396A; padding-top: 8px">{{k.src}}</div>
</div>
</template>
</section>
</template>

<section style="display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch">
<div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<div style="background: #10254D; border: 1px solid #22396A; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline">
<h2 style="margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em">Mapa de niveles · {{d.sym}}</h2>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<span style="font-size: 12px; color: #A3B0C6">Perfil por strike</span>
<div role="group" aria-label="Métrica del perfil por strike" style="display: flex; border: 1px solid #22396A; border-radius: 8px; overflow: hidden">
<button type="button" onClick="{{showOI}}" aria-pressed="{{oiPressed}}" style="{{oiBtnStyle}}">Open interest</button>
<button type="button" onClick="{{showVol}}" aria-pressed="{{volPressed}}" style="{{volBtnStyle}}">Volumen</button>
<button type="button" onClick="{{showGex}}" aria-pressed="{{gexPressed}}" style="{{gexBtnStyle}}">GEX OI</button>
<button type="button" onClick="{{showGexV}}" aria-pressed="{{gexvPressed}}" style="{{gexvBtnStyle}}">GEX vol</button>
</div>
</div>
</div>

<template data-k="if" value="{{isSimple}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: #A3B0C6">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 4px; height: 10px; background: #26A69A"></span><span style="width: 4px; height: 10px; background: #EF5350"></span>Velas 5m</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 16px; border-top: 2px dotted #EF5350"></span>EMA 9</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 16px; border-top: 2px solid #F5A35C"></span>SMA 20</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 16px; height: 9px; background: rgba(232, 237, 245, 0.12); border-top: 2px solid #7CD34B; border-bottom: 2px solid #E5534B"></span>Canal (call wall / put wall)</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 16px; border-top: 2px dotted #E8EDF5"></span>Zero Gamma</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 9px; height: 9px; border-radius: 50%; background: #FFFFFF"></span><span style="width: 9px; height: 9px; border-radius: 50%; border: 2px solid #E8EDF5; box-sizing: border-box"></span>PIN (lleno = certeza media+, hueco = baja)</span>

</div>
</template>
<template data-k="if" value="{{isFull}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 11px; color: #A3B0C6">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 4px; height: 10px; background: #26A69A"></span><span style="width: 4px; height: 10px; background: #EF5350"></span>Velas 5m vie</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 16px; border-top: 2px solid #E879A6"></span>EMA 9</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 16px; border-top: 2px solid #F5A35C"></span>SMA 20</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 16px; border-top: 2px solid #A78BFA"></span>SMA 200</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 16px; height: 9px; background: #2A2414; border: 1px dashed #7A6230"></span>EM lun</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 16px; border-top: 2px dashed #4C9AFF"></span>Gamma +</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 16px; border-top: 2px dotted #C9D3E3"></span>Zero γ</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 16px; border-top: 2px dashed #FF7A45"></span><span style="width: 16px; border-top: 2px solid #FF7A45"></span>Gamma − · muro put</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 16px; border-top: 2px dotted #F2B544"></span>Cierre vie</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 16px; border-top: 1px solid #5E6F91"></span>Máx / mín vie</span>
</div>
<div style="font-size: 11px; color: #A3B0C6">Los puntos sobre el viernes marcan cuándo cambió un major en las lecturas de 15 min (Perfil γ, vencimiento 10/30); el detalle va abajo de la gráfica. En la zona del lunes, los niveles del vencimiento 11/02.</div>
</template>

<div role="img" aria-label="{{chart.aria}}" style="display: grid; grid-template-columns: 52px minmax(0, 1fr) 72px minmax(200px, 22%); height: 480px">
<div style="position: relative">
<template data-k="for" list="{{chart.ticks}}" as="tk" hint-placeholder-count="4"><span style="{{tk.style}}">{{tk.label}}</span></template>
</div>
<div style="position: relative; overflow: hidden; border-left: 1px solid #22396A; border-bottom: 1px solid #22396A">
<template data-k="for" list="{{chart.ticks}}" as="tk" hint-placeholder-count="4"><div style="{{tk.grid}}"></div></template>
<div style="{{chart.emStyle}}"></div>
<div style="{{chart.pinBand}}"></div>
<div style="{{chart.zoneStyle}}"></div>
<span style="{{chart.zoneLabelStyle}}">{{chart.zoneLabel}}</span>
<span style="{{chart.emLabel}}">{{emTag}}</span>
<svg viewBox="0 0 1000 400" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%">
<path d="{{chart.chFill}}" fill="rgba(232, 237, 245, 0.045)"></path>
<path d="{{chart.cwDyn}}" fill="none" stroke="#7CD34B" stroke-width="1.5" vector-effect="non-scaling-stroke" opacity="0.9"></path>
<path d="{{chart.pwDyn}}" fill="none" stroke="#E5534B" stroke-width="1.5" vector-effect="non-scaling-stroke" opacity="0.9"></path>
<path d="{{chart.zgDyn}}" fill="none" stroke="#E8EDF5" stroke-width="1.5" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"></path>
<path d="{{chart.wickUp}}" fill="none" stroke="#26A69A" stroke-width="1" vector-effect="non-scaling-stroke"></path>
<path d="{{chart.wickDn}}" fill="none" stroke="#EF5350" stroke-width="1" vector-effect="non-scaling-stroke"></path>
<path d="{{chart.bodyUp}}" fill="#26A69A"></path>
<path d="{{chart.bodyDn}}" fill="#EF5350"></path>
<path d="{{chart.sma200}}" fill="none" stroke="#A78BFA" stroke-width="1.5" vector-effect="non-scaling-stroke"></path>
<path d="{{chart.ema21}}" fill="none" stroke="#F5A35C" stroke-width="1.5" vector-effect="non-scaling-stroke"></path>
<path d="{{chart.ema9}}" fill="none" stroke="#EF5350" stroke-width="1.5" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"></path>
</svg>
<template data-k="for" list="{{chart.levels}}" as="lv" hint-placeholder-count="7"><div style="{{lv.lineStyle}}"></div></template>
<template data-k="for" list="{{chart.off}}" as="o" hint-placeholder-count="1"><span style="{{o.style}}">{{o.t}}</span></template>
<template data-k="for" list="{{chart.events}}" as="ev" hint-placeholder-count="6"><span title="{{ev.title}}" style="{{ev.dot}}"></span></template>
<template data-k="for" list="{{chart.pinDots}}" as="pd" hint-placeholder-count="4"><span title="{{pd.title}}" style="{{pd.style}}"></span></template>
</div>
<div style="position: relative">
<template data-k="for" list="{{chart.levels}}" as="lv" hint-placeholder-count="7"><span style="{{lv.labelStyle}}">{{lv.t}}</span></template>
<template data-k="for" list="{{chart.pills}}" as="pq" hint-placeholder-count="5"><span style="{{pq.style}}">{{pq.t}}</span></template>
</div>
<div style="position: relative; overflow: hidden; background: #0B1A38; border-left: 1px solid #22396A; border-bottom: 1px solid #22396A">
<div style="position: absolute; top: 0; bottom: 0; left: 50%; border-left: 1px solid #2C4478"></div>
<template data-k="for" list="{{chart.ticks}}" as="tk" hint-placeholder-count="4"><div style="{{tk.grid}}"></div><span style="{{tk.pstyle}}">{{tk.label}}</span></template>
<template data-k="for" list="{{chart.levels}}" as="lv" hint-placeholder-count="7"><div style="{{lv.profLine}}"></div></template>
<template data-k="for" list="{{prof}}" as="pr" hint-placeholder-count="20">
<div style="{{pr.row}}">
<div style="display: flex; justify-content: flex-end; align-items: center; gap: 4px; min-width: 0">
<span style="font-size: 11px; color: #E8EDF5; white-space: nowrap">{{pr.lL}}</span>
<div style="{{pr.lBar}}"></div>
</div>
<div style="display: flex; align-items: center; gap: 4px; min-width: 0">
<div style="{{pr.rBar}}"></div>
<span style="font-size: 11px; color: #E8EDF5; white-space: nowrap">{{pr.rL}}</span>
</div>
</div>
</template>
</div>
</div>
<template data-k="if" value="{{chart.hasSem}}" hint-placeholder-val="{{false}}">
<div style="display: grid; grid-template-columns: 52px minmax(0, 1fr) 72px minmax(200px, 22%); align-items: center; font-size: 11px; color: #A3B0C6">
<span style="font-weight: 600; letter-spacing: 0.06em">FILTRO</span>
<svg viewBox="0 0 1000 10" preserveAspectRatio="none" aria-label="Historial del filtro de entrada por vela de 5 minutos" style="width: 100%; height: 12px; display: block">
